/**/gait_manager:
  ros__parameters:
    # Interpolation parameters
    angular_speed_deg_s: 20.0
    joint_tol_deg: 3.0

    # Quadruped gait
    # 0 - all legs in stance
    # 1 - back_left lifts up
    # 2 - back_left moves above position (+50 deg), other legs push (-16.7 deg)
    # 3 - back_left places down
    # 4 - front_left lifts up
    # 5 - front_left moves above position, other legs push
    # 6 - front_left places down
    # 7 - back_right lifts up
    # 8 - back_right moves above position, other legs push
    # 9 - back_right places down
    # 10 - front_right lifts up
    # 11 - front_right moves above position, other legs push
    gait:
      back_left_leg:
        0: [-40.0, -10.0, 100.0]
        1: [-40.0, -45.0, 90.0]
        2: [10.0, -45.0, 90.0]
        3: [10.0, -10.0, 100.0]
        4: [10.0, -10.0, 100.0]
        5: [-6.7, -10.0, 100.0]
        6: [-6.7, -10.0, 100.0]
        7: [-6.7, -10.0, 100.0]
        8: [-6.7, -10.0, 100.0]
        9: [-23.3, -10.0, 100.0]
        10: [-23.3, -10.0, 100.0]
        11: [-40.0, -10.0, 100.0]

      back_right_leg:
        0: [-6.7, 10.0, -100.0]
        1: [-6.7, 10.0, -100.0]
        2: [-23.3, 10.0, -100.0]
        3: [-23.3, 10.0, -100.0]
        4: [-23.3, 10.0, -100.0]
        5: [-40.0, 10.0, -100.0]
        6: [-40.0, 10.0, -100.0]
        7: [-40.0, 45.0, -90.0]
        8: [10.0, 45.0, -90.0]
        9: [10.0, 10.0, -100.0]
        10: [10.0, 10.0, -100.0]
        11: [-6.7, 10.0, -100.0]

      front_left_leg:
        0: [16.7, -10.0, 100.0]
        1: [16.7, -10.0, 100.0]
        2: [0.0, -10.0, 100.0]
        3: [0.0, -10.0, 100.0]
        4: [0.0, -45.0, 90.0]
        5: [50.0, -45.0, 90.0]
        6: [50.0, -10.0, 100.0]
        7: [50.0, -10.0, 100.0]
        8: [33.3, -10.0, 100.0]
        9: [33.3, -10.0, 100.0]
        10: [33.3, -10.0, 100.0]
        11: [16.7, -10.0, 100.0]

      front_right_leg:
        0: [50.0, 10.0, -100.0]
        1: [50.0, 10.0, -100.0]
        2: [33.3, 10.0, -100.0]
        3: [33.3, 10.0, -100.0]
        4: [33.3, 10.0, -100.0]
        5: [16.7, 10.0, -100.0]
        6: [16.7, 10.0, -100.0]
        7: [16.7, 10.0, -100.0]
        8: [0.0, 10.0, -100.0]
        9: [0.0, 10.0, -100.0]
        10: [0.0, 45.0, -90.0]
        11: [50.0, 45.0, -90.0]
