/**/gait_manager:
  ros__parameters:
    # Interpolation parameters
    angular_speed_deg_s: 20.0
    joint_tol_deg: 3.0

    # Turtle gait
    gait:
      back_left_leg:
        0: [25.0, -40.0, 90.0]
        1: [25.0, -10.0, 100.0]
        2: [-25.0, 0.0, 90.0]
        3: [-25.0, -40.0, 100.0]

      back_right_leg:
        0: [25.0, 40.0, -90.0]
        1: [25.0, 10.0, -100.0]
        2: [-25.0, 0.0, -90.0]
        3: [-25.0, 40.0, -100.0]

      front_left_leg:
        0: [25.0, -40.0, 90.0]
        1: [25.0, -10.0, 100.0]
        2: [-25.0, 0.0, 90.0]
        3: [-25.0, -40.0, 100.0]

      front_right_leg:
        0: [25.0, 40.0, -90.0]
        1: [25.0, 10.0, -100.0]
        2: [-25.0, 0.0, -90.0]
        3: [-25.0, 40.0, -100.0]
